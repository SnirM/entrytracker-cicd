name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test
        run: |
          echo "Build/Test here..."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

      EC2_INSTANCE_ID: i-0d611d3432a0cfcc9

      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Debug AWS identity + region
        run: |
          set -e
          aws sts get-caller-identity --region "$AWS_REGION"
          aws configure list

      - name: Verify EC2 instance exists in this account/region
        run: |
          set -e
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Placement.AvailabilityZone,VpcId,PrivateIpAddress]" \
            --output table

      - name: Verify SSM managed instance is ONLINE
        run: |
          set -e
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
            --output table

      - name: Deploy via SSM (TAG targets) + robust path detection
        shell: bash
        run: |
          set -euo pipefail

          echo "== Send SSM Command using TAG target =="

          # NOTE: לא משתמשים פה ב-set -e בתחילת הסקריפט על השרת
          # כדי ש-CD שלא קיים לא יפיל הכל. נבדוק ידנית.
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --comment "GitHub Actions deploy EntryTracker" \
            --parameters 'commands=[
              "echo DEPLOY_START: $(date)",
              "echo RUN_AS=$(id -un) UID=$(id -u) HOME=$HOME SHELL=$SHELL",
              "",
              "# נריץ את עיקר העבודה כ-ubuntu כדי ש-~ יעבוד ונתיבים יהיו צפויים",
              "if id ubuntu >/dev/null 2>&1; then",
              "  RUN_AS_USER=ubuntu",
              "else",
              "  RUN_AS_USER=$(id -un)",
              "fi",
              "echo Using user: $RUN_AS_USER",
              "",
              "run_as() {",
              "  if [ \"$RUN_AS_USER\" = \"ubuntu\" ] && [ \"$(id -un)\" = \"root\" ]; then",
              "    sudo -u ubuntu -H bash -lc \"$1\"",
              "  else",
              "    bash -lc \"$1\"",
              "  fi",
              "}",
              "",
              "run_as \"echo USER=\$(whoami); echo HOME=\$HOME; pwd\"",
              "run_as \"uname -a\"",
              "",
              "# ננסה למצוא את הפרויקט בכמה מקומות נפוצים במקום לנחש",
              "run_as \"for d in /home/ubuntu/entryTracker /home/ubuntu/entrytracker ~/entryTracker ~/entrytracker /opt/entryTracker /opt/entrytracker; do",
              "  if [ -d \\\"$d\\\" ]; then",
              "    echo FOUND_PROJECT_DIR=$d",
              "    cd \\\"$d\\\"",
              "    pwd",
              "    ls -la",
              "    exit 0",
              "  fi",
              "done",
              "echo PROJECT_DIR_NOT_FOUND; echo listing /home/ubuntu and ~; ls -la /home/ubuntu || true; ls -la ~ || true; exit 2\"",
              "",
              "echo DEPLOY_DONE: $(date)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "CommandId: $CMD_ID"

          echo "== Wait for command execution to finish =="
          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_RC=$?
          set -e

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)
          echo "Invocation Status: $STATUS"

          echo "== STDOUT =="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo
          echo "== STDERR =="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo
          echo "== Response Code =="
          RC=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "ResponseCode" \
            --output text || true)
          echo "$RC"

          if [ "$WAIT_RC" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "SSM command failed (status=$STATUS, wait_rc=$WAIT_RC, rc=$RC)"
            exit 1
          fi

      - name: Post deploy check
        run: |
          echo "Deploy job finished successfully."
