name: CI/CD Pipeline (SSM Deploy)

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import test
        run: |
          python -c "import app; print('OK')"

  version:
    name: Version (Patch++)
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        shell: bash
        run: |
          set -e
          git fetch --tags
          LAST=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            NEW="v1.0.0"
          else
            IFS=. read M m p <<< "${LAST#v}"
            NEW="v$M.$m.$((p+1))"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$NEW"
          git push origin "$NEW"
          echo "tag=$NEW" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: version
    outputs:
      tag: ${{ needs.version.outputs.tag }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        run: |
          REG="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REG/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REG/$ECR_REPOSITORY:latest
          docker push $REG/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REG/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve EC2 instance by TAG
        id: resolve
        run: |
          set -e
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ "$IID" = "None" ] || [ -z "$IID" ]; then
            echo "No running instance found"
            exit 1
          fi
          echo "instance_id=$IID" >> $GITHUB_OUTPUT

      - name: Verify SSM Online
        run: |
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ steps.resolve.outputs.instance_id }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text | grep Online

      - name: Deploy via SSM
        run: |
          set -e
          CID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${{ steps.resolve.outputs.instance_id }}" \
            --parameters "commands=[
              \"set -e\",
              \"cd ${PROJECT_DIR}\",
              \"docker compose pull\",
              \"docker compose up -d --remove-orphans\",
              \"docker image prune -f\",
              \"docker compose ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CID" \
            --instance-id "${{ steps.resolve.outputs.instance_id }}"

          aws ssm get-command-invocation \
            --command-id "$CID" \
            --instance-id "${{ steps.resolve.outputs.instance_id }}" \
            --query "StandardOutputContent" \
            --output text
