name: EntryTracker CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize variables (remove CRLF)
        shell: bash
        run: |
          clean() { printf "%s" "$1" | tr -d '\r\n'; }
          echo "AWS_REGION=$(clean '${{ vars.AWS_REGION }}')" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(clean '${{ vars.ECR_REGISTRY }}')" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(clean '${{ vars.ECR_REPOSITORY }}')" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t entrytracker:latest .

      - name: Tag & Push Docker image
        shell: bash
        run: |
          set -e
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "Pushing: $IMAGE"
          docker tag entrytracker:latest "$IMAGE"
          docker push "$IMAGE"

  deploy:
    name: Deploy to EC2 (SSM)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Sanitize variables (remove CRLF)
        shell: bash
        run: |
          clean() { printf "%s" "$1" | tr -d '\r\n'; }
          echo "AWS_REGION=$(clean '${{ vars.AWS_REGION }}')" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(clean '${{ vars.ECR_REGISTRY }}')" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(clean '${{ vars.ECR_REPOSITORY }}')" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        shell: bash
        run: |
          set -e
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Deploying $IMAGE to $INSTANCE_ID via SSM..."

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy EntryTracker from ECR" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"docker pull ${IMAGE}\",
              \"docker rm -f entrytracker || true\",
              \"docker run -d --name entrytracker --restart unless-stopped -p 5000:5000 ${IMAGE}\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "SSM status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "SSM output:"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true
            echo "SSM error:"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text || true
            exit 1
          fi
