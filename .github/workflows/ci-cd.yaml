name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basic app import test
        run: |
          python -c "import app; print('app import OK')"

  version:
    name: Version (Patch++)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    outputs:
      image_tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout (with tags history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and create git tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags

          LAST_TAG="$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1 || true)"

          if [ -z "${LAST_TAG}" ]; then
            NEW_TAG="v1.0.0"
          else
            ver="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$ver"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "New tag: ${NEW_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [version]
    outputs:
      image_tag: ${{ needs.version.outputs.image_tag }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t "${ECR_REPOSITORY}:${IMAGE_TAG}" .

      - name: Tag & Push
        run: |
          set -euo pipefail
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

  deploy:
    name: Deploy to EC2 (SSM + docker compose)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

      # TAG-based targeting (כמו שעשית אצלך)
      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker

      # נתיב הפרויקט על השרת (אצלך: /home/ubuntu/entrytracker-cicd)
      PROJECT_DIR: /home/ubuntu/entrytracker-cicd

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify SSM target(s) exist (by TAG)
        shell: bash
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --query "InstanceInformationList[].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
            --output table

      - name: Deploy via SSM (AWS-RunShellScript)
        shell: bash
        run: |
          set -euo pipefail

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Sending SSM command..."
          CMD_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --comment "GitHub Actions deploy EntryTracker (ECR + docker compose + nginx)" \
            --parameters "commands=[
              \"set -e\",
              \"echo DEPLOY_START: \$(date)\",
              \"echo RUN_AS=\$(id -un) UID=\$(id -u)\",

              \"ECR_REGISTRY='${ECR_REGISTRY}'\",
              \"ECR_REPOSITORY='${ECR_REPOSITORY}'\",
              \"IMAGE_TAG='${IMAGE_TAG}'\",
              \"AWS_REGION='${AWS_REGION}'\",
              \"PROJECT_DIR='${PROJECT_DIR}'\",

              \"echo Using PROJECT_DIR=\${PROJECT_DIR}\",
              \"cd \${PROJECT_DIR}\",
              \"ls -la\",

              \"# מתחברים ל-ECR בעזרת ה-Instance Role (אין keys על השרת)\",
              \"aws ecr get-login-password --region \${AWS_REGION} | docker login --username AWS --password-stdin \${ECR_REGISTRY}\",

              \"# מייצרים/מעדכנים .env ל-compose (פשוט ויציב)\",
              \"cat > .env << EOF\",
              \"ECR_REGISTRY=\${ECR_REGISTRY}\",
              \"ECR_REPOSITORY=\${ECR_REPOSITORY}\",
              \"IMAGE_TAG=\${IMAGE_TAG}\",
              \"EOF\",

              \"docker compose pull\",
              \"docker compose up -d --remove-orphans\",
              \"docker image prune -f || true\",
              \"docker compose ps\",
              \"echo DEPLOY_DONE: \$(date)\"
            ]" \
            --query "Command.CommandId" \
            --output text)"

          echo "CommandId: $CMD_ID"

          echo "Waiting for completion..."
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$CMD_ID"

          echo "=== STATUS ==="
          aws ssm list-command-invocations \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --details \
            --query "CommandInvocations[].Status" \
            --output text

          echo "=== OUTPUT (first target) ==="
          INSTANCE_ID="$(aws ssm list-command-invocations \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --query "CommandInvocations[0].InstanceId" \
            --output text)"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "=== ERRORS (first target) ==="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          STATUS="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM deploy failed: $STATUS"
            exit 1
          fi
