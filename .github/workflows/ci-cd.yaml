name: EntryTracker CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # מנקה \n \r ורווחים מיותרים מה-Variables כדי שלא יפול שוב על "invalid reference format"
      - name: Sanitize variables
        id: vars
        shell: bash
        run: |
          set -e
          REGISTRY="$(echo -n '${{ vars.ECR_REGISTRY }}' | tr -d '\r\n' | xargs)"
          REPO="$(echo -n '${{ vars.ECR_REPOSITORY }}' | tr -d '\r\n' | xargs)"
          REGION="$(echo -n '${{ vars.AWS_REGION }}' | tr -d '\r\n' | xargs)"

          if [[ -z "$REGISTRY" || -z "$REPO" || -z "$REGION" ]]; then
            echo "Missing required variables. Check AWS_REGION / ECR_REGISTRY / ECR_REPOSITORY"
            exit 1
          fi

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"         >> "$GITHUB_OUTPUT"
          echo "region=$REGION"     >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.vars.outputs.region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # פה אין docker tag ידני בכלל -> פחות תקלות
      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/${{ steps.vars.outputs.repo }}:latest
            ${{ steps.vars.outputs.registry }}/${{ steps.vars.outputs.repo }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Sanitize deploy variables
        id: deployvars
        shell: bash
        run: |
          set -e
          HOST="$(echo -n '${{ vars.EC2_HOST }}' | tr -d '\r\n' | xargs)"
          USER="$(echo -n '${{ vars.EC2_USER }}' | tr -d '\r\n' | xargs)"
          REGISTRY="$(echo -n '${{ vars.ECR_REGISTRY }}' | tr -d '\r\n' | xargs)"
          REPO="$(echo -n '${{ vars.ECR_REPOSITORY }}' | tr -d '\r\n' | xargs)"
          REGION="$(echo -n '${{ vars.AWS_REGION }}' | tr -d '\r\n' | xargs)"

          if [[ -z "$HOST" || -z "$USER" || -z "$REGISTRY" || -z "$REPO" || -z "$REGION" ]]; then
            echo "Missing required variables. Check EC2_HOST / EC2_USER / AWS_REGION / ECR_REGISTRY / ECR_REPOSITORY"
            exit 1
          fi

          echo "host=$HOST"       >> "$GITHUB_OUTPUT"
          echo "user=$USER"       >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"       >> "$GITHUB_OUTPUT"
          echo "region=$REGION"   >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.deployvars.outputs.region }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.deployvars.outputs.host }}
          username: ${{ steps.deployvars.outputs.user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e

            REGISTRY="${{ steps.deployvars.outputs.registry }}"
            REPO="${{ steps.deployvars.outputs.repo }}"
            REGION="${{ steps.deployvars.outputs.region }}"
            IMAGE="$REGISTRY/$REPO:latest"

            echo "Deploying: $IMAGE"

            # Login to ECR (צריך aws-cli על השרת; אצלך כבר יש לפי הפלט ששלחת)
            aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"

            # Pull latest image
            docker pull "$IMAGE"

            # Restart container
            docker rm -f entrytracker || true

            docker run -d \
              --name entrytracker \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE"

            docker image prune -f || true

            echo "Done. entrytracker running on port 5000"
