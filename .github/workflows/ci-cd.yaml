name: EntryTracker CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write   # חובה ל-OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # מנקה תווי CR ורווחים מה-Variables כדי ש-Docker לא ייכשל
      - name: Sanitize variables
        run: |
          echo "AWS_REGION=$(echo '${{ vars.AWS_REGION }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(echo '${{ vars.ECR_REGISTRY }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(echo '${{ vars.ECR_REPOSITORY }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t entrytracker:latest .

      - name: Tag image
        run: |
          docker tag entrytracker:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Sanitize variables (deploy)
        run: |
          echo "EC2_HOST=$(echo '${{ vars.EC2_HOST }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "EC2_USER=$(echo '${{ vars.EC2_USER }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "AWS_REGION=$(echo '${{ vars.AWS_REGION }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(echo '${{ vars.ECR_REGISTRY }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(echo '${{ vars.ECR_REPOSITORY }}' | tr -d '\r' | xargs)" >> $GITHUB_ENV

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ודא שיש Docker
            docker --version

            # התחברות ל-ECR מתוך השרת
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # משיכה של האימג' החדש
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # עצירה והסרה אם רץ כבר
            docker rm -f entrytracker || true

            # הרצה מחדש
            docker run -d --name entrytracker -p 5000:5000 $ECR_REGISTRY/$ECR_REPOSITORY:latest

            docker ps | grep entrytracker
