name: EntryTracker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t entrytracker .

      - name: Tag Docker image
        run: |
          docker tag entrytracker:latest \
          ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Docker version:"
            docker --version

            echo "Login to ECR"
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin 80765078119.dkr.ecr.ap-south-1.amazonaws.com

            echo "Pull image"
            docker pull 80765078119.dkr.ecr.ap-south-1.amazonaws.com/entrytracker:latest

            echo "Stop old container"
            docker rm -f entrytracker || true

            echo "Run new container"
            docker run -d \
              --name entrytracker \
              -p 80:5000 \
              80765078119.dkr.ecr.ap-south-1.amazonaws.com/entrytracker:latest
