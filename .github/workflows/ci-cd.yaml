name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test
        run: |
          echo "Build/Test here..."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

      EC2_INSTANCE_ID: i-0d611d3432a0cfcc9

      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Debug AWS identity + region
        run: |
          set -e
          echo "== Caller Identity =="
          aws sts get-caller-identity --region "$AWS_REGION"
          echo
          echo "== AWS Configure List =="
          aws configure list
          echo
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

      - name: Verify EC2 instance exists in this account/region
        run: |
          set -e
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Placement.AvailabilityZone,VpcId,PrivateIpAddress]" \
            --output table

      - name: Verify SSM managed instance is ONLINE
        run: |
          set -e
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
            --output table

      - name: Deploy via SSM (TAG targets) + print stdout/stderr on failure
        shell: bash
        run: |
          set -euo pipefail

          echo "== Send SSM Command using TAG target =="
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --comment "GitHub Actions deploy EntryTracker" \
            --parameters 'commands=[
              "set -eux",
              "echo DEPLOY_START: $(date)",
              "whoami",
              "hostname",
              "uname -a",
              "cd /home/ubuntu/entryTracker || cd ~",
              "pwd",
              "ls -la",
              "echo DEPLOY_DONE: $(date)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "CommandId: $CMD_ID"

          echo "== Wait for command execution to finish =="
          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_RC=$?
          set -e

          echo "== Get invocation status =="
          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)
          echo "Invocation Status: $STATUS"

          echo "== STDOUT =="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo
          echo "== STDERR =="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo
          echo "== Response Code =="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "ResponseCode" \
            --output text || true

          if [ "$WAIT_RC" -ne 0 ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "SSM command failed (status=$STATUS, wait_rc=$WAIT_RC)"
            exit 1
          fi

      - name: Post deploy check
        run: |
          echo "Deploy job finished successfully."
