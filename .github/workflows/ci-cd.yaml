name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # דוגמה - תחליף לשלבים שלך
      - name: Build & Test
        run: |
          echo "Build/Test here..."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      # ✅ REGION נכון לפי מה ששלחת
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

      # אופציונלי (אם עדיין רוצים גם Instance ID)
      EC2_INSTANCE_ID: i-0d611d3432a0cfcc9

      # ✅ TAG targets (מומלץ)
      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 1) Configure AWS credentials
      # =========================
      # אם אתה עובד עם OIDC (מומלץ):
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # אם אתה עובד עם Access Keys במקום OIDC:
      # - name: Configure AWS credentials (Access Keys)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ env.AWS_REGION }}

      # =========================
      # 2) Debug: זהות + Region בפועל
      # =========================
      - name: Debug AWS identity + region
        run: |
          set -e
          echo "== Caller Identity =="
          aws sts get-caller-identity --region "$AWS_REGION"
          echo
          echo "== AWS Configure List =="
          aws configure list
          echo
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

      # =========================
      # 3) Verify instance exists (כדי להוכיח Region/Account תקין)
      # =========================
      - name: Verify EC2 instance exists in this account/region
        run: |
          set -e
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Placement.AvailabilityZone,VpcId,PrivateIpAddress,Tags]" \
            --output table

      # =========================
      # 4) Verify SSM managed instance is ONLINE
      # =========================
      - name: Verify SSM managed instance is ONLINE
        run: |
          set -e
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[].[InstanceId,PingStatus,PlatformName,AgentVersion,IPAddress]" \
            --output table

      # =========================
      # 5) Deploy via SSM using TAG targets
      # =========================
      - name: Deploy via SSM (TAG targets)
        run: |
          set -e

          echo "== Send SSM Command using TAG target =="
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --comment "GitHub Actions deploy EntryTracker" \
            --parameters 'commands=[
              "set -e",
              "echo DEPLOY_START: $(date)",
              "whoami",
              "hostname",
              "uname -a",
              "cd /home/ubuntu/entryTracker || cd ~",
              "pwd",
              "ls -la",
              "echo DEPLOY_DONE: $(date)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "CommandId: $CMD_ID"

          echo "== Wait for command execution to finish =="
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}"

          echo "== Fetch command output =="
          aws ssm list-command-invocations \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --details \
            --query "CommandInvocations[].CommandPlugins[].{Name:Name,Status:Status,Output:Output}" \
            --output json

      - name: Post deploy check
        run: |
          echo "Deploy job finished successfully."
