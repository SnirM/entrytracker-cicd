name: EntryTracker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t entrytracker .

      - name: Tag Docker image
        run: |
          docker tag entrytracker:latest \
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REGISTRY="${{ vars.ECR_REGISTRY }}"
            REPO="${{ vars.ECR_REPOSITORY }}"
            REGION="${{ vars.AWS_REGION }}"
            IMAGE="$REGISTRY/$REPO:latest"

            echo "Deploying $IMAGE"

            # Login to ECR
            aws ecr get-login-password --region "$REGION" | sudo docker login --username AWS --password-stdin "$REGISTRY"

            # Pull latest image
            sudo docker pull "$IMAGE"

            # Stop old container if exists
            sudo docker rm -f entrytracker || true

            # Run new container
            sudo docker run -d \
              --name entrytracker \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE"

            # Cleanup
            sudo docker image prune -f

            echo "Deployment finished successfully"
