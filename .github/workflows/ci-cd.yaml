name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # החלף לתהליך הבילד/טסט שלך
      - name: Build & Test
        run: |
          echo "Build/Test here..."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

      # Instance ID שלך (לפי מה ששלחת קודם)
      EC2_INSTANCE_ID: i-0d611d3432a0cfcc9

      # TAG targets - חובה לשים את הטאג הזה על האינסטנס
      SSM_TAG_KEY: SSMDeploy
      SSM_TAG_VALUE: entrytracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Credentials דרך Secrets (Access Keys)
      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Debug: מי אני + באיזה region אני
      - name: Debug AWS identity + region
        run: |
          set -e
          echo "== Caller Identity =="
          aws sts get-caller-identity --region "$AWS_REGION"
          echo
          echo "== AWS Configure List =="
          aws configure list
          echo
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

      # בדיקה שהאינסטנס באמת קיים בחשבון/region הנכון
      - name: Verify EC2 instance exists in this account/region
        run: |
          set -e
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Placement.AvailabilityZone,VpcId,PrivateIpAddress]" \
            --output table

      # בדיקה שהאינסטנס רשום ב-SSM (Managed instance) וב-Online
      - name: Verify SSM managed instance is ONLINE
        run: |
          set -e
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[].[InstanceId,PingStatus,PlatformName,AgentVersion]" \
            --output table

      # Deploy דרך SSM עם TAG target
      - name: Deploy via SSM (TAG targets)
        run: |
          set -e

          echo "== Send SSM Command using TAG target =="
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --comment "GitHub Actions deploy EntryTracker" \
            --parameters 'commands=[
              "set -e",
              "echo DEPLOY_START: $(date)",
              "whoami",
              "hostname",
              "uname -a",
              "cd /home/ubuntu/entryTracker || cd ~",
              "pwd",
              "ls -la",
              "echo DEPLOY_DONE: $(date)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "CommandId: $CMD_ID"

          echo "== Wait for command execution to finish =="
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --targets "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}"

          echo "== Fetch command output =="
          aws ssm list-command-invocations \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --details \
            --query "CommandInvocations[].CommandPlugins[].{Name:Name,Status:Status,Output:Output}" \
            --output json

      - name: Post deploy check
        run: |
          echo "Deploy job finished successfully."
