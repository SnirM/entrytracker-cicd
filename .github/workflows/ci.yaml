name: EntryTracker CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1) Pull source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Build (standalone) - install deps
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3) Run unit tests (curl) - start app in background on 5001
      - name: Start app (background)
        run: |
          nohup env PORT=5001 python app.py > app.log 2>&1 &
          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:5001/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 1
          done
          echo "App did not start. Logs:"
          cat app.log
          exit 1

      - name: Unit test (curl)
        run: |
          curl -sSf http://127.0.0.1:5001/ | tee unit_response.json

      # 4) Package (Docker image)
      - name: Build Docker image
        run: |
          docker build -t entrytracker:latest .

      # חשוב: לעצור את ה-standalone לפני E2E כדי שלא יתפוס פורטים/תהליכים
      - name: Stop standalone app
        run: |
          pkill -f "python app.py" || true

      # 5) End-to-end (E2E) tests with docker-compose
      - name: E2E up (compose)
        run: |
          docker compose -f docker-compose.yaml up -d
          docker compose -f docker-compose.yaml ps

          # wait for app endpoint
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "E2E is up"
              break
            fi
            echo "Waiting for E2E..."
            sleep 2
          done

          curl -sSf http://127.0.0.1:5000/ | tee e2e_response.json

      # Cleanup always
      - name: E2E cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v
