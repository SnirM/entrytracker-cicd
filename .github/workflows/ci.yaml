name: EntryTracker CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1) Pull source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Build (standalone) - install deps
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3) Run app in background (standalone, no Docker)
      - name: Start app (background)
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 1
          done
          echo "App did not start. Logs:"
          cat app.log
          exit 1

      # 4) Unit test (curl)
      - name: Unit test (curl)
        run: |
          curl -sSf http://127.0.0.1:5000/ | tee unit_response.json

      # 5) Package (Docker image)
      - name: Build Docker image
        run: |
          docker build -t entrytracker:latest .

      # 6) E2E (docker compose + curl)
      - name: E2E up (compose)
        run: |
          docker compose -f docker-compose.yaml up -d
          docker compose -f docker-compose.yaml ps

          # Wait for app endpoint to be ready
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:5000/ > /dev/null; then
              echo "E2E is up"
              break
            fi
            echo "Waiting for E2E..."
            sleep 2
          done

          curl -sSf http://127.0.0.1:5000/ | tee e2e_response.json

      # 7) Cleanup always
      - name: E2E cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yaml down -v
