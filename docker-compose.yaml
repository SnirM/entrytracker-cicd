services:
  mysql:
    image: mysql:5.7
    container_name: entrytracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  entrytracker:
    image: entrytracker:latest
    container_name: entrytracker-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: app_db
    ports:
      - "5000:5000"
    restart: always

volumes:
  mysql_data:
