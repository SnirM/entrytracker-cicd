version: '3.8'
services:
  mysql:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    networks:
      - app-network

  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: entrytracker_app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: app_db
    depends_on:
      - mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
