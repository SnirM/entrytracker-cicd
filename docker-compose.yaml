services:
  # 1) DB (Postgres)
  db:
    image: postgres:16-alpine
    container_name: entrytracker-db
    environment:
      POSTGRES_DB: entrytracker
      POSTGRES_USER: entrytracker
      POSTGRES_PASSWORD: entrytrackerpass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrytracker -d entrytracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2) App (EntryTracker) - נמשך מ-ECR (לא build!)
  entrytracker:
    image: "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
    container_name: entrytracker-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # אם אצלך האפליקציה משתמשת בשמות אחרים, תגיד לי ואכוון בדיוק.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: entrytracker
      DB_USER: entrytracker
      DB_PASSWORD: entrytrackerpass

      # אופציונלי אם יש אצלך:
      # FLASK_ENV: production
      # PORT: "5000"
    expose:
      - "5000"
    restart: unless-stopped

  # 3) Nginx (Reverse Proxy) - חושף החוצה רק פורט 80
  nginx:
    image: nginx:1.25-alpine
    container_name: entrytracker-nginx
    depends_on:
      - entrytracker
    ports:
      - "80:80"
    volumes:
      # מזריקים את הקונפיג שלך לתוך nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  db_data:
