services:
  mysql:
    image: mysql:5.7
    container_name: entrytracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  entrytracker:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: entrytracker-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: app_db
      PORT: "5000"
    restart: always
    networks:
      - app-network
    # חשוב: לא חושפים את 5000 החוצה כשה-nginx קיים
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: entrytracker-nginx
    depends_on:
      - entrytracker
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
