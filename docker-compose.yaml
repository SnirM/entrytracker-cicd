services:
  entrytracker:
    image: "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
    container_name: entrytracker
    restart: unless-stopped
    environment:
      - PORT=5000
    expose:
      - "5000"
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: entrytracker-nginx
    restart: unless-stopped
    depends_on:
      - entrytracker
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
